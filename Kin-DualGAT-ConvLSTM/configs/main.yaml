experiment:
  seed: 42
  model_name: "KinDualGATConvLSTM"

data:
  data_path: "./data/CB-FQA"
  batch_size: 32
  max_seq_len: 300

training:
  epochs: 150
  optimizer: "AdamW"
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  patience: 20
  warmup_epochs: 10
  min_lr: 0.000001

losses:
  lambda_phy: 0.1

evaluation:
  metrics: ["R2", "RMSE", "MAE", "PLCC", "SRCC"]